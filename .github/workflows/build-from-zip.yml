name: Build APK from source ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract Android source
        run: |
          rm -rf app-src
          mkdir -p app-src
          unzip -oq MinecraftLagDiag-source.zip -d app-src

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_PATH" > app-src/local.properties

          echo "Android SDK: $SDK_PATH"
          sdkmanager --version

      - name: Show extracted project
        run: |
          echo "Project root:"
          ls -la app-src
          echo
          echo "App:"
          ls -la app-src/app

      - name: Test, lint, and build APK
        run: |
          gradle \
            --project-dir app-src \
            --no-daemon \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLagDiag-debug
          path: app-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            app-src/app/build/reports/tests/
            app-src/app/build/reports/lint-results-debug*
          if-no-files-found: ignore
